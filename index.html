<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourDiary — Личный дневник ощущений</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #191636;
        color: #fdfcff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      @keyframes yourdiary-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #191636; color: #fdfcff;">
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background-color: #191636; color: #fdfcff; font-family: monospace;">
        <div style="width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #f59e0b; border-radius: 50%; animation: yourdiary-spin 0.8s linear infinite;"></div>
        <div style="font-size: 12px; letter-spacing: 0.15em; opacity: 0.75; text-transform: uppercase;">YOURDIARY // ЗАГРУЗКА...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
